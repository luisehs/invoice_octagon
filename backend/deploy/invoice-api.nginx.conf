# Nginx para Invoice Octagon API.
#
# Telegram EXIGE HTTPS válido para el webhook (POST /telegram/webhook). El flujo
# es: (1) apuntar el DNS de api.octagonpr.co a la EC2, (2) desplegar este bloque
# HTTP:80, (3) correr `sudo certbot --nginx -d api.octagonpr.co`, que obtiene el
# certificado Y reescribe este archivo agregando el bloque `listen 443 ssl` + la
# redirección 80→443. El bloque comentado al final es una REFERENCIA de cómo
# queda tras certbot (no lo descomentes a mano: los certificados aún no existen
# y `nginx -t` fallaría).
#
# Nota: server_name pasa de `_` (catch-all) al dominio, así que tras este cambio
# la API responde por api.octagonpr.co (no por IP). Asegúrate de que el DNS ya
# apunte a la EC2 antes de recargar nginx.

server {
    listen 80;
    server_name api.octagonpr.co;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

